services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: uni_shop_china
      MYSQL_USER: unishop_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-replace_with_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_locally}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql, ./infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://unishop_app:${MYSQL_APP_PASSWORD:-replace_with_local_password}@mysql:3306/uni_shop_china?charset=utf8mb4
      FRONTEND_URL: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: {mysql: {condition: service_healthy}}
    volumes: [./backend:/app]
  frontend:
    build: ./frontend
    environment: {VITE_API_BASE_URL: http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    volumes: [./frontend:/app, frontend_node_modules:/app/node_modules]
    depends_on: [backend]
volumes:
  mysql_data:
  frontend_node_modules:
