events {}
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Never log query strings. Private evidence tickets belong only in headers.
    log_format safe_access '$remote_addr $request_method $uri $status';
    access_log /var/log/nginx/access.log safe_access;
    server {
        listen 80;
        client_max_body_size 6m;
        add_header Referrer-Policy "no-referrer" always;
        location = /api/v1/chat/ws {
            # Never log malformed credentials in handshake URLs or upgrade errors.
            access_log off;
            error_log /dev/null;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 10s;
            proxy_buffering off;
            proxy_pass http://backend:8000;
        }
        location = /api/v1/seller-verification/evidence/content {
            # Defense in depth against malformed/legacy requests carrying credentials.
            access_log off;
            error_log /dev/null;
            proxy_hide_header Referrer-Policy;
            proxy_pass http://backend:8000;
        }
        # Only product-image intake needs 10 MiB + 64 KiB multipart envelope.
        # Keep the existing 6m cap for seller evidence and other endpoints.
        location ~ "^/api/v1/seller/products/item-[0-9a-f]{24}/images$" {
            client_max_body_size 10551296;
            proxy_hide_header Referrer-Policy;
            proxy_pass http://backend:8000;
        }
        location /api/ {
            proxy_hide_header Referrer-Policy;
            proxy_pass http://backend:8000;
        }
        location / { proxy_pass http://frontend:5173; }
    }
}
