events {}
http {
    # Never log query strings: private evidence access uses short-lived tickets.
    log_format safe_access '$remote_addr $request_method $uri $status';
    access_log /var/log/nginx/access.log safe_access;
    server {
        listen 80;
        client_max_body_size 6m;
        add_header Referrer-Policy "no-referrer" always;
        location = /api/v1/seller-verification/evidence/content {
            # Upstream errors can include the original URI; suppress capability-bearing logs.
            access_log off;
            error_log /dev/null;
            proxy_hide_header Referrer-Policy;
            proxy_pass http://backend:8000;
        }
        location /api/ {
            proxy_hide_header Referrer-Policy;
            proxy_pass http://backend:8000;
        }
        location / { proxy_pass http://frontend:5173; }
    }
}
